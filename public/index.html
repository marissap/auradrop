<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraDrop</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">

</head>

<body>

    <div id="setup">
        <div class="setup-layout">
            <div>
                <h2>auradrop</h2>
                <p>collab with nearby friends :)</p>
            </div>
            <div class="field"><label>name</label><input id="input-name" type="text" placeholder="your name"
                    maxlength="24" autocomplete="off"></div>
            <div class="field">
                <label>phone number</label>
                <input id="input-phone" type="tel" placeholder="+1 555 000 0000">
                <span class="muted" id="hash-hint"></span>
            </div>
            <div class="field"><label>status (optional)</label><input id="input-status" type="text"
                    placeholder="at the coffee shop" maxlength="40"></div>
            <button class="button-primary" id="enter-btn" type="button" disabled>enter auradrop →</button>
        </div>
    </div>

    <div id="app">
        <nav>
            <div class="container">
                <b>auradrop</b>
                <span class="tag" id="conn-tag">offline</span>
            </div>
            <div class="container">
                <span class="tag" id="geohash-tag">—</span>
                <span class="muted" id="user-name">—</span>
                <span class="muted" id="user-status">set status...</span>
            </div>
        </nav>
        <div id="columns">
            <div id="left">
                <section>
                    <h3>contacts <span class="muted" id="contact-count">(0)</span></h3>
                    <div class="row">
                        <input id="input-contact" type="tel" placeholder="+1 555 000 0000">
                        <button id="add-contact-btn">add</button>
                    </div>
                    <div id="contact-list"></div>
                </section>
                <section>
                    <h3>nearby <span class="muted" id="nearby-count">(0)</span></h3>
                    <div class="grid" id="nearby"><span class="muted full-width">searching for
                            friends...</span></div>
                </section>
            </div>
            <div id="right">
                <div id="idle">
                    <div class="idle-inner">
                        <div class="idle-icon">✦</div>
                        <div>no active session</div>
                    </div>
                </div>
                <div id="session">
                    <div id="session-header">
                        <b id="session-name">—</b>
                        <button id="end-session-btn" class="ml-auto">end</button>
                    </div>
                    <div id="messages"></div>
                    <div id="input-row">
                        <textarea id="msg-input" placeholder="message… or @ai for AI"></textarea>
                        <button id="send-btn" class="button-primary">send</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="overlay" id="file-overlay">
            <div class="overlay-inner">
                <strong id="offer-filename">file.zip</strong><small id="offer-info">0 KB</small>
                <div class="sheet-btns">
                    <button id="accept-offer-btn" class="button-primary">accept</button>
                    <button id="reject-offer-btn">decline</button>
                </div>
            </div>
        </div>

        <div class="overlay" id="invite-overlay">
            <div class="overlay-inner">
                <strong id="invite-from">someone</strong>
                <small>wants to start a session</small>
                <div class="sheet-btns">
                    <button id="accept-invite-btn" class="button-primary">join</button>
                    <button id="reject-invite-btn">decline</button>
                </div>
            </div>
        </div>

        <div class="overlay" id="nearby-overlay">
            <div class="overlay-inner">
                <strong id="nearby-who">someone</strong><small>is nearby</small>
                <div class="sheet-btns">
                    <button id="start-with-nearby-btn" class="button-primary">start session</button>
                    <button id="dismiss-nearby-btn">dismiss</button>
                </div>
            </div>
        </div>

        <div id="toasts"></div>

        <script src="./app.js" defer></script>
</body>

</html>
